server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Arquivos com hash no nome podem ficar em cache por longo período.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Fallback da SPA: rotas como /meu-link devolvem o index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

# Desenvolvimento local.
#   Só o banco (para rodar API/web com pnpm dev):  docker compose up -d postgres
#   Stack completa em containers:                 docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brevly
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brevly"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/brevly
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ./server
      target: runtime
    # Credenciais do R2 (opcionais) vêm de server/.env, se existir.
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/brevly
      FRONTEND_URL: http://localhost:4173
      CORS_ORIGIN: http://localhost:4173,http://localhost:5173
    ports:
      - "3333:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        # URLs usadas pelo navegador do usuário, não pela rede interna do Docker.
        VITE_FRONTEND_URL: http://localhost:4173
        VITE_BACKEND_URL: http://localhost:3333
    ports:
      - "4173:8080"
    depends_on:
      - server

volumes:
  postgres-data:
